<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023E8A" />
      <stop offset="100%" stop-color="#0A2540" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Shield -->
  <path d="M32 4 C44 4, 56 9, 56 18 C56 38, 44 54, 32 60 C20 54, 8 38, 8 18 C8 9, 20 4, 32 4 Z"
        fill="url(#shieldGrad)" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round"/>

  <!-- Inner Shield Accent -->
  <path d="M32 9 C41 9, 50 13, 50 20 C50 36, 40 49, 32 54 C24 49, 14 36, 14 20 C14 13, 23 9, 32 9 Z"
        fill="#07192E" opacity="0.85"/>

  <!-- Safety Flame Icon in Center -->
  <path d="M32 17 C34 22, 39 25, 39 31 C39 36, 35.5 40, 32 40 C28.5 40, 25 36, 25 31 C25 27, 28 23, 30 20 C30.5 23, 32 25, 32 25 C32 25, 33 21, 32 17 Z"
        fill="url(#flameGrad)" />

  <!-- Verification Checkmark / Compliance Notch -->
  <path d="M22 36 L28 42 L42 27"
        fill="none" stroke="url(#checkGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
